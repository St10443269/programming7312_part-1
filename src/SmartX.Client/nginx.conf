server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # NOTE: a `types { }` block at this level would *replace* nginx's whole
    # built-in MIME map (not merge with it), which previously made every
    # file - including index.html - serve as application/octet-stream and
    # get downloaded instead of rendered. Scope the .wasm fix to just that
    # extension instead, so the inherited default MIME map still applies
    # everywhere else.
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    location / {
        # Client-side routed SPA: unknown paths fall back to index.html.
        try_files $uri $uri/ /index.html;

        # index.html has no explicit cache lifetime of its own, so browsers
        # fall back to heuristic freshness (based on Last-Modified) and can
        # reuse a stale cached copy - including one saved with a bad
        # Content-Type from before this file existed - without even asking
        # the server. Force revalidation on every request instead.
        add_header Cache-Control "no-cache";
    }
}
